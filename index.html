<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="main.css" />
    <style>
      #logo {
        width: calc(100% - 40px);
        max-width: 700px;
        margin: 0 auto;
        margin-bottom: 30px;
      }
      #logo img {
        width: 100%;
      }
      #desc {
        margin-bottom: 30px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: inline-block;
        padding: 10px;
        font-size: 22px;
      }
      hr {
        height: 5px;
        background: #eee;
        border: none;
      }
      @media (max-width: 450px) {
        li {
          font-size: 16px;
        }
      }
      .pubkey {
        width: calc(100% - 20px);
        max-width: 450px;
        margin: 10px auto;
      }
      .pubkey a {
        font-size: 12px;
      }
      .pubkey code {
        font-size: 10px;
      }
      .pubkey .buts::after {
        font-size: 10px;
        color: #f24632;
        content: attr(data-value);
      }
      .pubkey span.key-des::before {
        content: "PUBLIC KEYS";
        position: relative;
        top: -2px;
        color: #aaa;
      }
      .pubkey span.key-des {
        margin-top: 10px;
      }
      .pubkey span.key-des, .pubkey span.fp-des {
        display: block;
        padding: 0;
        font-size: 10px;
        font-family: 'Gotham Bold';
        text-align: left;
        height: 8px;
        background-color: #ccc;
      }
      .key {
        display: block;
        width: calc(100% - 40px);
        margin: 0;
        height: 40px;
        resize: none;
        padding: 20px;
        border: 0;
        line-height: 10px;
        overflow-x: hidden;
        overflow-y: scroll;
        background-color: #eee;
        text-align: left;
        font-family: monospace;
        font-size: 10px;
      }
      .pubkey span.fp-des-dec {
        display: block;
        height: 8px;
        background-color: #eee;
      }
      .pubkey span.fp-des::before {
        content: "PRIMARY KEY FINGERPRINT";
        position: relative;
        top: -2px;
        color: #aaa;
      }
      .pubkey pre.fp {
        font-size: 14px;
        font-weight: bold;
        margin: 0 0 10px 0;
        padding: 3px;
        overflow: auto;
        color: #555;
        background-color: #eee;
      }
    </style>

    <title> UME.INK </title>

        <li>

        </li>
        <li>
          i[🅰🆃]bitbili.net
        </li>

    </div>
    <div class='pubkey'>
      <h4>My RSA 4096 Key</h4>
      <a href="./0x1E100000FA95E6B5">Download</a>
      <code>or</code>
      <span class='buts'>
        <button onclick="copyKey(this)">COPY</button>
      </span>
      <span class="key-des"></span>
      <textarea class='key' disabled></textarea>
      <span class="fp-des-dec"></span>
      <span class="fp-des"></span>
      <pre class="fp">BECD E3D2 D95B 5A43 3934  D520 1E10 0000 FA95 E6B5</pre>
    </div>
  </body>
  <script>
    function copyKey(e) {
      e.parentElement.setAttribute('data-value', '');
      const key = e.parentElement.parentElement.getElementsByClassName("key")[0];
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
        var range = document.createRange();
        key.disabled=false;
        range.selectNodeContents(key);
        var s = window.getSelection();
        s.removeAllRanges();
        s.addRange(range);
        key.setSelectionRange(0, 999999);
        key.disabled=true;
      } else {
        key.disabled=false;
        key.select();
        key.disabled=true;
      }
      copied = window.getSelection().rangeCount > 0 && document.execCommand("copy");
      e.parentElement.setAttribute('data-value', copied ? 'copied!' : 'uncopied!');
    }

    document.addEventListener('DOMContentLoaded', function () {
      const keyArea = document.getElementsByClassName('key')[0];
      fetch('./0x1E100000FA95E6B5')
        .then(function (res) {
          if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
          return res.text();
        })
        .then(function (text) { keyArea.value = text.replace(/\s+$/, ''); })
        .catch(function (err) { console.error('failed to load public key:', err); });
    });
  </script>
